services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: waraqah
      POSTGRES_PASSWORD: waraqah
      POSTGRES_DB: waraqah
    ports: ["5432:5432"]
    volumes:
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waraqah -d waraqah"]
      interval: 3s
      retries: 20
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: waraqah
      POSTGRES_PASSWORD: waraqah
      POSTGRES_DB: waraqah_test
    ports: ["5433:5432"]
    volumes:
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waraqah -d waraqah_test"]
      interval: 3s
      retries: 20
volumes:
  dbdata:
